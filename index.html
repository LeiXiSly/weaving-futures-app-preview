function go(key){historyStack.push(active);active=key;galleryMode=false;draw()}
function historyBack(){if(historyStack.length){active=historyStack.pop();draw()}else go('home')}
function draw(){document.getElementById('stage').classList.toggle('mode',galleryMode);if(galleryMode){document.getElementById('stage').innerHTML='<div class="gallery">'+SCREENS.map(s=>'<div onclick="go(\''+s.key+'\')" style="cursor:pointer">'+renderOne(s.key,true)+'<div class="miniLabel">'+s.group+' · '+s.title+'</div></div>').join('')+'</div>'}else document.getElementById('stage').innerHTML=renderOne(active);
const groups=[...new Set(SCREENS.map(s=>s.group))];document.getElementById('nav').innerHTML=groups.map(g=>'<div class="eyebrow">'+g+'</div>'+SCREENS.filter(s=>s.group===g).map(s=>'<button class="'+(s.key===active?'active':'')+'" onclick="go(\''+s.key+'\')">'+s.title+'<small>'+s.eyebrow+'</small></button>').join('')).join('')}
function toggleMode(){galleryMode=!galleryMode;draw()}draw();</script></body></html>
